[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qreferee"
version = "0.1.0"
description = "An honest, finite-sample statistical referee for quantum measurement claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["quantum", "statistics", "entanglement", "CHSH", "validation", "reproducibility"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qref = "qreferee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
